plugins { id 'com.android.application' }
def releaseInfo = new groovy.json.JsonSlurper().parse(rootProject.file('version.json'))
android {
    namespace 'app.qasdm.test'
    compileSdk 35
    defaultConfig {
        applicationId 'app.qasdm.test'
        minSdk 26
        targetSdk 34
        versionCode releaseInfo.android.versionCode as int
        versionName releaseInfo.android.versionName
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'WEB_VERSION', '"' + (releaseInfo.publicVersion ?: releaseInfo.version) + '"'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        test { storeFile rootProject.file('test-signing.p12'); storePassword 'qasdm-test'; keyAlias 'qasdm-test'; keyPassword 'qasdm-test' }
    }
    buildTypes { debug { signingConfig signingConfigs.test } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets { main { assets.srcDirs = [layout.buildDirectory.dir('generated/assets'), 'src/main/assets'] } }
}
tasks.register('prepareWebAssets', Copy) {
    from(rootProject.projectDir) { include 'index.html', 'update.js', 'android-runtime.js' }
    into(layout.buildDirectory.dir('generated/assets/www'))
}
tasks.register('prepareLicenseAssets', Copy) {
    from(rootProject.projectDir) { include 'LICENSE', 'THIRD_PARTY_NOTICES.md' }
    into(layout.buildDirectory.dir('generated/assets/licenses'))
}
tasks.named('preBuild').configure { dependsOn 'prepareWebAssets', 'prepareLicenseAssets' }
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'ru.noties:jlatexmath-android:0.2.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

