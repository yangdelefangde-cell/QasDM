plugins { id 'com.android.application' }
def releaseInfo = new groovy.json.JsonSlurper().parse(rootProject.file('version.json'))
android {
    namespace 'app.qasdm.test'
    compileSdk 35
    defaultConfig {
        applicationId 'app.qasdm.test'
        minSdk 26
        targetSdk 34
        versionCode releaseInfo.android.versionCode as int
        versionName releaseInfo.android.versionName
        buildConfigField 'String', 'WEB_VERSION', '"' + releaseInfo.version + '"'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        test { storeFile rootProject.file('test-signing.p12'); storePassword 'qasdm-test'; keyAlias 'qasdm-test'; keyPassword 'qasdm-test' }
    }
    buildTypes { debug { signingConfig signingConfigs.test } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets { main { assets.srcDirs = [layout.buildDirectory.dir('generated/assets')] } }
}
tasks.register('prepareWebAssets', Copy) {
    from(rootProject.projectDir) { include 'index.html', 'update.js', 'android-runtime.js' }
    into(layout.buildDirectory.dir('generated/assets/www'))
}
tasks.named('preBuild').configure { dependsOn 'prepareWebAssets' }
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
